<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Buttons</title>
<link rel="stylesheet" href="card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: end; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .btn { padding: 12px 22px; border-radius: 9999px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
  .primary { background: #FF0000; color: #fff; }
  .primary-hover { background: #C8102E; color: #fff; }
  .primary-press { background: #C8102E; color: #fff; transform: scale(0.98); box-shadow: 0 8px 24px rgba(255,0,0,0.18); }
  .secondary { background: #F5F5F5; color: #1A1A1A; border-radius: 12px; }
  .ghost { background: transparent; color: #1A1A1A; border: 1px solid #D4D4D4; border-radius: 12px; }
  .destructive { background: transparent; color: #C8102E; border: 1px solid #C8102E; border-radius: 9999px; }
  .disabled { background: #FF0000; color: #fff; opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="card">
  <div class="card__head">
    <div class="card__title">Buttons · Pill primary, rect secondary</div>
    <div class="card__sub">Pick one and stick to it</div>
  </div>
  <div class="grid">
    <div class="item"><div class="lbl">primary / rest</div><button class="btn primary">Einlösen</button></div>
    <div class="item"><div class="lbl">primary / hover</div><button class="btn primary-hover">Einlösen</button></div>
    <div class="item"><div class="lbl">primary / press</div><button class="btn primary-press">Einlösen</button></div>
    <div class="item"><div class="lbl">primary / disabled</div><button class="btn disabled">Einlösen</button></div>
    <div class="item"><div class="lbl">secondary</div><button class="btn secondary">Später</button></div>
    <div class="item"><div class="lbl">ghost</div><button class="btn ghost">Zur Karte</button></div>
    <div class="item"><div class="lbl">destructive</div><button class="btn destructive">Verwerfen</button></div>
    <div class="item"><div class="lbl">text link</div><a style="font-size:14px;color:#C8102E;border-bottom:1px solid #C8102E;padding-bottom:1px">Mehr erfahren</a></div>
  </div>
</div>
</body>
</html>
