<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Inputs</title>
<link rel="stylesheet" href="card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 14px; max-width: 480px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--fg-2); margin-bottom: 6px; letter-spacing: 0.02em; }
  .field input, .field select {
    width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px;
    border: 1px solid #D4D4D4; border-radius: 12px; background: #fff; color: #1A1A1A;
    font-family: inherit;
  }
  .field input:focus { outline: none; border-color: #C8102E; box-shadow: 0 0 0 3px rgba(255,0,0,0.18); }
  .field.error input { border-color: #DE350B; }
  .field.error .msg { color: #DE350B; font-size: 12px; margin-top: 6px; }
  .toggle { display: flex; align-items: center; gap: 10px; }
  .switch { position: relative; width: 40px; height: 24px; background: #FF0000; border-radius: 999px; }
  .switch::after { content: ''; position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; }
  .switch.off { background: #D4D4D4; }
  .switch.off::after { left: 3px; right: auto; }
  .toggle span { font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="card__head">
    <div class="card__title">Inputs · 12 px radius</div>
    <div class="card__sub">Red focus ring</div>
  </div>
  <div class="stack">
    <div class="field"><label>E-Mail</label><input type="email" value="anna.schmidt@web.de"></div>
    <div class="field" style="--c:#C8102E"><label>Postleitzahl</label><input value="20354" style="border-color:#C8102E;box-shadow:0 0 0 3px rgba(255,0,0,0.18)"></div>
    <div class="field error"><label>Aktionscode</label><input value="LOTTE-XX"><div class="msg">Code nicht mehr gültig</div></div>
    <div class="toggle"><div class="switch"></div><span>Push-Mitteilungen aktiv</span></div>
    <div class="toggle"><div class="switch off"></div><span style="color:#8A8A8A">Standortverlauf teilen</span></div>
  </div>
</div>
</body>
</html>
