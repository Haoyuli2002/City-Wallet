<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Type roles</title>
<link rel="stylesheet" href="card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .role { display: grid; grid-template-columns: 110px 1fr; gap: 18px; align-items: center; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .pill { display: inline-block; background: var(--brand-red-soft); color: var(--brand-red-deep); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
</style>
</head>
<body>
<div class="card">
  <div class="card__head">
    <div class="card__title">Type roles · Offer-widget grammar</div>
    <div class="card__sub">Top to bottom</div>
  </div>
  <div class="stack">
    <div class="role"><div class="tag">.t-trigger</div><div><span class="pill">☔ ES REGNET · 11 °C</span></div></div>
    <div class="role"><div class="tag">.t-hero</div><div style="font-size:40px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;color:var(--brand-red);font-feature-settings:'tnum' 1">−15 %</div></div>
    <div class="role"><div class="tag">.t-h2</div><div style="font-size:24px;font-weight:600">Cappuccino</div></div>
    <div class="role"><div class="tag">.t-body</div><div style="font-size:16px">Café Lotte · 80 m</div></div>
    <div class="role"><div class="tag">.t-countdown</div><div style="font-size:14px;font-weight:500;color:#FF8A3D;font-feature-settings:'tnum' 1">noch 24 Min.</div></div>
    <div class="role"><div class="tag">.t-cta</div><div><span style="display:inline-block;background:#FF0000;color:#fff;padding:10px 22px;border-radius:999px;font-size:16px;font-weight:600">Einlösen</span></div></div>
  </div>
</div>
</body>
</html>
