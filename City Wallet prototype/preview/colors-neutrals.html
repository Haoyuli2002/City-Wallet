<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Neutrals</title>
<link rel="stylesheet" href="card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .step { border-radius: 8px; overflow: hidden; border: 1px solid var(--stroke-1); }
  .step__chip { height: 64px; }
  .step__meta { padding: 8px 10px; background: var(--bg-1); }
  .step__name { font-size: 11px; font-weight: 600; color: var(--fg-1); }
  .step__hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="card__head">
    <div class="card__title">Neutrals · Warm-leaning</div>
    <div class="card__sub">Ink scale + surfaces + strokes</div>
  </div>
  <div class="scale">
    <div class="step"><div class="step__chip" style="background:#0A0A0A"></div><div class="step__meta"><div class="step__name">ink</div><div class="step__hex">#0A0A0A</div></div></div>
    <div class="step"><div class="step__chip" style="background:#1A1A1A"></div><div class="step__meta"><div class="step__name">fg-1</div><div class="step__hex">#1A1A1A</div></div></div>
    <div class="step"><div class="step__chip" style="background:#4A4A4A"></div><div class="step__meta"><div class="step__name">fg-2</div><div class="step__hex">#4A4A4A</div></div></div>
    <div class="step"><div class="step__chip" style="background:#8A8A8A"></div><div class="step__meta"><div class="step__name">fg-3</div><div class="step__hex">#8A8A8A</div></div></div>
    <div class="step"><div class="step__chip" style="background:#D4D4D4"></div><div class="step__meta"><div class="step__name">stroke-2</div><div class="step__hex">#D4D4D4</div></div></div>
    <div class="step"><div class="step__chip" style="background:#EAEAEA"></div><div class="step__meta"><div class="step__name">stroke-1</div><div class="step__hex">#EAEAEA</div></div></div>
    <div class="step"><div class="step__chip" style="background:#FAFAFA;border:1px solid #EAEAEA;border-radius:0"></div><div class="step__meta"><div class="step__name">bg-3</div><div class="step__hex">#FAFAFA</div></div></div>
  </div>
</div>
</body>
</html>
