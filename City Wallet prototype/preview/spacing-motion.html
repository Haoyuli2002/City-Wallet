<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Motion</title>
<link rel="stylesheet" href="card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .block { border: 1px solid var(--stroke-1); border-radius: 12px; padding: 14px 16px; }
  h4 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--stroke-1); }
  .row:last-child { border-bottom: none; }
  .key { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
</style>
</head>
<body>
<div class="card">
  <div class="card__head">
    <div class="card__title">Motion · No bounce, no overshoot</div>
    <div class="card__sub">German functionalism</div>
  </div>
  <div class="grid">
    <div class="block">
      <h4>Easing</h4>
      <div class="row"><span class="key">standard</span><span class="val">cubic-bezier(.4,0,.2,1)</span></div>
      <div class="row"><span class="key">emphasized</span><span class="val">cubic-bezier(.2,0,0,1)</span></div>
    </div>
    <div class="block">
      <h4>Duration</h4>
      <div class="row"><span class="key">fast</span><span class="val">150 ms</span></div>
      <div class="row"><span class="key">base</span><span class="val">250 ms</span></div>
      <div class="row"><span class="key">slow</span><span class="val">400 ms</span></div>
    </div>
  </div>
</div>
</body>
</html>
